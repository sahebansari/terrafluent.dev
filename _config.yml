title: TerraFluent
tagline: Fluent .NET solutions for reporting and data visualization
description: >-
  TerraFluent builds open-source, MIT-licensed .NET libraries for reports and
  charts — true PDF files, print-ready HTML, native Word documents, and
  server-side SVG charts — one fluent API family, zero heavyweight
  dependencies.
url: "https://terrafluent.dev"
baseurl: ""
lang: en

# Cache-busting token appended to main.css and main.js as ?v=…
# Leave blank to use the build timestamp — every deploy then gets a fresh URL,
# which is the safe default. Set it to a fixed string (e.g. "2026-09-14a") only
# if you want the token to change solely when you say so; you must then
# remember to bump it whenever those two files change.
asset_version:

github_user: sahebansari
repos:
  html: https://github.com/sahebansari/TerraFluent.Html.Reporting
  docx: https://github.com/sahebansari/TerraFluent.Docx.Reporting
  pdf: https://github.com/sahebansari/TerraFluent.Pdf.Reporting
  chart: https://github.com/sahebansari/TerraFluent.Chart.Reporting
nuget:
  html: https://www.nuget.org/packages/TerraFluent.Html.Reporting
  docx: https://www.nuget.org/packages/TerraFluent.Docx.Reporting
  pdf: https://www.nuget.org/packages/TerraFluent.Pdf.Reporting
  chart: https://www.nuget.org/packages/TerraFluent.Chart.Reporting

plugins:
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SEO-CHECKLIST.md
  - ENTERPRISE-CHECKLIST.md
  - scripts
  - vendor
  - .jekyll-cache
