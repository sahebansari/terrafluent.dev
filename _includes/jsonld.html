{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "TerraFluent",
  "url": "{{ site.url }}/",
  "description": {{ site.description | strip_newlines | strip | jsonify }}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "TerraFluent",
  "url": "{{ site.url }}/",
  "logo": "{{ '/assets/img/og-card.png' | absolute_url }}",
  "sameAs": [
    "{{ site.repos.html }}",
    "{{ site.repos.docx }}",
    "{{ site.nuget.html }}",
    "{{ site.nuget.docx }}",
    "https://github.com/{{ site.github_user }}"
  ]
}
</script>
{% endif %}
{% if page.url != "/" and page.url != "/404.html" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" }{% if page.doc_section %},
    { "@type": "ListItem", "position": 2, "name": "{{ page.doc_section }}", "item": "{{ page.doc_section_url | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.nav_title | default: page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% else %},
    { "@type": "ListItem", "position": 2, "name": {{ page.nav_title | default: page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% endif %}
  ]
}
</script>
{% endif %}
{% if page.software %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{ page.software.name }}",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Windows, Linux, macOS",
  "softwareVersion": "{{ page.software.version }}",
  "programmingLanguage": "C#",
  "license": "https://opensource.org/licenses/MIT",
  "url": "{{ page.url | absolute_url }}",
  "downloadUrl": "{{ page.software.nuget }}",
  "codeRepository": "{{ page.software.repo }}",
  "softwareHelp": "{{ '/docs/' | absolute_url }}",
  "sameAs": [ "{{ page.software.nuget }}", "{{ page.software.repo }}" ],
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "description": {{ page.description | strip_newlines | strip | jsonify }}
}
</script>
{% endif %}
{% if page.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}{
      "@type": "Question",
      "name": {{ item.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | strip_newlines | strip | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
